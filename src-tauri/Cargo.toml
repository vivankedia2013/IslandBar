[package]
name = "islandbar"
version = "0.1.8"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "network"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Media_Control", "Foundation", "Foundation_Collections"
] }

# Small + fast binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
